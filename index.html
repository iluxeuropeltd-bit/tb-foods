<html lang="en-IE">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="Our fridge and freezer stock, shops and spend.">
<meta name="theme-color" content="#0f5c55" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1514" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">

<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><img src="icons/icon-192.png" alt="" width="28" height="28"><span id="title">T&amp;B Foods</span></div>
    <button class="sync" id="sync" type="button" aria-live="polite"><span class="dot"></span><span class="label">…</span></button>
  </header>

  <main id="main">
    <section id="view-stock" class="view"></section>
    <section id="view-plan" class="view" hidden></section>
    <section id="view-add" class="view" hidden></section>
    <section id="view-spend" class="view" hidden></section>
    <section id="view-more" class="view" hidden></section>
  </main>

  <nav class="tabbar" aria-label="Main">
    <button data-tab="stock" class="on"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg><span>Stock</span></button>
    <button data-tab="plan"><svg viewBox="0 0 24 24"><path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6 2.1 2.1m0-12.8-2.1 2.1m-8.6 8.6-2.1 2.1"/></svg><span>Plan</span></button>
    <button data-tab="add" class="fab" aria-label="Add or scan"><svg viewBox="0 0 24 24"><path d="M4 7V5a1 1 0 0 1 1-1h2M17 4h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2M8 9v6M11 9v6M14 9v6M17 9v6"/></svg><span>Scan / Add</span></button>
    <button data-tab="spend"><svg viewBox="0 0 24 24"><path d="M17 6.5A6 6 0 1 0 17 17.5M4 10.5h9M4 13.5h9"/></svg><span>Spend</span></button>
    <button data-tab="more"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>More</span></button>
  </nav>
</div>

<div id="sheet-wrap" hidden>
  <div class="backdrop" data-act="close-sheet"></div>
  <div class="sheet" role="dialog" aria-modal="true"><div class="grip"></div><div id="sheet"></div></div>
</div>
<div id="toast" hidden></div>
<div id="onboard" hidden></div>
<div id="reader-file" hidden></div>

<script src="config.js?v=1"></script>
<script src="seed.js?v=1"></script>
<script src="vendor/html5-qrcode.min.js" defer></script>

<script src="app.js?v=1" defer></script>
</body>
</html>
